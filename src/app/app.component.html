<form [formGroup]="form">
  <div style="margin-top: 15px; padding: 15px; display: grid; gap: 15px; grid-template-columns: repeat(2, minmax(0, 1fr));">
    <angular-client-side-dropdown type="single" classes="custom-class" panelClass="custom-panel" label="Client Side Single Selection"
      nameKey="houseNumber" valueKey="id" [data]="options1" formControlName="singleClientSideSelect"
      [config]="config.unitId" (selectedValueNamesUpdated)="setOptionFirstData($event)"></angular-client-side-dropdown>

    <angular-client-side-dropdown type="multiple" classes="custom-class" panelClass="custom-panel" label="Client Side Multiple Selection With Set First Option"
      nameKey="houseNumber" valueKey="id" [data]="options1" formControlName="multipleClientSideSelectWithFirst"
      [config]="config.unitIdMultiple"></angular-client-side-dropdown>

    <angular-client-side-dropdown type="multiple" classes="custom-class" panelClass="custom-panel" label="Client Side Multiple Selection"
      nameKey="teamName" valueKey="teamId" [(data)]="options2" formControlName="multipleClientSideSelect"
      [config]="config.multipleClientSideSelect" (selectedValueNamesUpdated)="setOptionSecondData($event)"></angular-client-side-dropdown>
  </div>
  <div style="margin-top: 15px; padding: 15px; display: grid; gap: 15px; grid-template-columns: repeat(2, minmax(0, 1fr));">
    <div>
      {{options1Data | json}}
    </div>

    <div>
      {{options2Data | json}}
    </div>
  </div>
  <div style="padding: 15px; display: grid; gap: 15px; grid-template-columns: repeat(2, minmax(0, 1fr));">
    <angular-server-side-dropdown type="single" classes="custom-class" panelClass="custom-panel" label="Server Side Single Selection"
      nameKey="shortDesc" valueKey="id" [(data)]="options3" formControlName="singleServerSideSelect"
      [config]="config.singleServerSideSelect" (selectedValueNamesUpdated)="setOptionThirdData($event)"></angular-server-side-dropdown>

    <angular-server-side-dropdown type="multiple" classes="custom-class" panelClass="custom-panel" label="Server Side Multiple Selection"
      nameKey="shortDesc" valueKey="id" [(data)]="options4" formControlName="multipleServerSideSelect"
      [config]="config.multipleServerSideSelect" [isRequiredPayload]="true" [payload]="serversidePayload" (selectedValueNamesUpdated)="setOptionFourthData($event)"></angular-server-side-dropdown>
  </div>
  <div style="margin-top: 15px; padding: 15px; display: grid; gap: 15px; grid-template-columns: repeat(2, minmax(0, 1fr));">
    <div>
      {{options3Data | json}}
    </div>

    <div>
      {{options4Data | json}}
    </div>
  </div>

  <div style="padding: 15px; display: grid; gap: 15px; grid-template-columns: repeat(2, minmax(0, 1fr));">
    <angular-client-side-dropdown type="multiple" classes="custom-class" panelClass="custom-panel" label="Server Side Single Selection With Tags"
      nameKey="fullName" valueKey="id" [(data)]="options5" formControlName="singleClientSideSelectWithTags"
      [config]="config.singleClientSideSelectWithTags"></angular-client-side-dropdown>
  </div>
</form>
