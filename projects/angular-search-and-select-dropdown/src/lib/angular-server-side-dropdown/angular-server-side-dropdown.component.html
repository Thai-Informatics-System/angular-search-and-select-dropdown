@if(type == 'single'){
    <angular-select-single [customId]="customId" [appearance]="appearance" [classes]="classes" [panelClass]="panelClass"
        [label]="label" [placeholder]="placeholder" [allOptionsLabel]="allOptionsLabel" [isLabelOutside]="isLabelOutside" [isDisplayPlaceholder]="isDisplayPlaceholder"
        [formControl]="fc" [isRequired]="isRequired" [nameKey]="nameKey" [valueKey]="valueKey" [initialData]="data"
        (initialDataChange)="setData($event)" [validationMessages]="validationMessages" [config]="config"
        [(loading)]="loading" (loadingChange)="onLoadingChange($event)" [refetch]="toggle" (refetchChange)="onRefetchChange($event)"
        [isRequiredPayload]="isRequiredPayload" [payload]="payload" [prefix]="prefix" [suffix]="suffix"></angular-select-single>
}
@else if(type == 'multiple'){
    <angular-select-multiple [customId]="customId" [appearance]="appearance" [classes]="classes" [panelClass]="panelClass"
        [label]="label" [placeholder]="placeholder" [allOptionsLabel]="allOptionsLabel" [isLabelOutside]="isLabelOutside" [isDisplayPlaceholder]="isDisplayPlaceholder"
        [formControl]="fc" [isRequired]="isRequired" [nameKey]="nameKey" [valueKey]="valueKey" [initialData]="data"
        (initialDataChange)="setData($event)" [validationMessages]="validationMessages" [config]="config"
        [(loading)]="loading" (loadingChange)="onLoadingChange($event)" [refetch]="toggle" (refetchChange)="onRefetchChange($event)"
        [isRequiredPayload]="isRequiredPayload" [payload]="payload" [prefix]="prefix" [suffix]="suffix"></angular-select-multiple>
}
