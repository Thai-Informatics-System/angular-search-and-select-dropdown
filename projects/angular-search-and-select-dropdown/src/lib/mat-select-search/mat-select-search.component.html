<!-- <input matInput class="mat-select-search-input mat-select-search-hidden" [(ngModel)]="val" [ngModelOptions]="{standalone: true}" /> -->
<div class="mat-select-search-inner" [class.mat-select-search-inner-multiple]="matSelect.multiple">
  <input matInput class="mat-select-search-input" #searchSelectInput (keydown)="_handleKeydown($event)"
    (input)="onInputChange($event)" (blur)="onBlur($event)" [placeholder]="placeholderLabel" />
    @if (value && !loading) {
      <button mat-icon-button aria-label="Clear" (click)="_reset(true)"
        class="mat-select-search-clear">
        <mat-icon>close</mat-icon>
      </button>
    }
    @if (loading) {
      <button mat-icon-button aria-label="Clear" class="mat-select-search-clear">
        <span class="spinner-border spinner-border-sm" role="loading" aria-hidden="true"></span>
      </button>
    }
  </div>

  @if (noEntriesFoundLabel && value && _options?.length === 0) {
    <div class="mat-select-search-no-entries-found">
      {{noEntriesFoundLabel}}
    </div>
  }
