@if(type == 'single'){
    <angular-single-select [customId]="customId" [appearance]="appearance" [classes]="classes" [panelClass]="panelClass"
        [label]="label" [placeholder]="placeholder" [allOptionsLabel]="allOptionsLabel" [isLabelOutside]="isLabelOutside" [isDisplayPlaceholder]="isDisplayPlaceholder"
        [formControl]="fc" [isRequired]="isRequired" [nameKey]="nameKey" [valueKey]="valueKey" [initialData]="data"
        (initialDataChange)="setData($event)" [validationMessages]="validationMessages" [config]="config"
        [(loading)]="loading" [isRefreshing]="isRefreshing" (loadingChange)="onLoadingChange($event)" [(refetch)]="toggle"
        [isRequiredPayload]="isRequiredPayload" [payload]="payload" [prefix]="prefix" [suffix]="suffix"></angular-single-select>
}
@else if(type == 'multiple'){
    <angular-multiple-select [customId]="customId" [appearance]="appearance" [classes]="classes" [panelClass]="panelClass"
        [label]="label" [placeholder]="placeholder" [allOptionsLabel]="allOptionsLabel" [isLabelOutside]="isLabelOutside" [isDisplayPlaceholder]="isDisplayPlaceholder"
        [formControl]="fc" [isRequired]="isRequired" [nameKey]="nameKey" [valueKey]="valueKey" [initialData]="data"
        (initialDataChange)="setData($event)" [validationMessages]="validationMessages" [config]="config"
        [(loading)]="loading" [isRefreshing]="isRefreshing" (loadingChange)="onLoadingChange($event)" [(refetch)]="toggle"
        [isRequiredPayload]="isRequiredPayload" [payload]="payload" [prefix]="prefix" [suffix]="suffix"></angular-multiple-select>
}
